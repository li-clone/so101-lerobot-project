# Copy to hardware_ports.local.yaml and replace every placeholder locally.
robot:
  type: so101_follower
  id: so101_follower_main
  port: /dev/serial/by-id/<FOLLOWER_SERIAL_DEVICE>

teleop:
  type: so101_leader
  id: so101_leader_main
  port: /dev/serial/by-id/<LEADER_SERIAL_DEVICE>

cameras:
  handeye:
    type: opencv
    index_or_path: /dev/v4l/by-path/<HANDEYE_VIDEO_INDEX0>
    width: 640
    height: 480
    fps: 30
    fourcc: YUYV
  environment:
    type: opencv
    index_or_path: /dev/v4l/by-id/<ENVIRONMENT_VIDEO_INDEX0>
    width: 640
    height: 480
    fps: 30
    fourcc: MJPG
